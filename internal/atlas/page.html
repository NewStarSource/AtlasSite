<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{.Title}} · 星图</title><link rel="stylesheet" href="/assets/site.css"><script src="/assets/core.js" defer></script></head>
<body><a class="skip-link" href="#main">跳到主要内容</a><div class="layout">
<aside class="sidebar"><a href="/" class="logo" aria-label="星图首页"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 24 15 37 20 24 24 20 37 15 24 3 20 15 15Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg><span>星图<small>找到社群，留下讨论</small></span></a>
<nav class="nav" aria-label="主要导航">
<a href="/" class="nav-item {{if eq .Page "home"}}active{{end}}"><span class="nav-icon" aria-hidden="true">⌂</span>首页动态</a>
<a href="/discover" class="nav-item {{if or (eq .Page "discover") (eq .Page "community") (eq .Page "topic")}}active{{end}}"><span class="nav-icon" aria-hidden="true">◇</span>发现社群</a>
<a href="/search" class="nav-item {{if eq .Page "search"}}active{{end}}"><span class="nav-icon" aria-hidden="true">⌕</span>站内搜索</a>
{{if .Identity}}<a href="/notifications" class="nav-item {{if eq .Page "notifications"}}active{{end}}"><span class="nav-icon" aria-hidden="true">♧</span>通知</a>
<a href="/my" class="nav-item {{if or (eq .Page "my") (eq .Page "user") (eq .Page "bookmarks") (eq .Page "drafts") (eq .Page "subscriptions") (eq .Page "settings") (eq .Page "security")}}active{{end}}"><span class="nav-icon" aria-hidden="true">○</span>我的空间</a>{{end}}
<a href="/help" class="nav-item {{if eq .Page "help"}}active{{end}}"><span class="nav-icon" aria-hidden="true">?</span>帮助与反馈</a>
</nav><a class="btn btn-primary compose-link" href="{{if .Identity}}/new{{else}}/login{{end}}">＋ 发布动态</a>
<div class="sidebar-bottom">{{if .Identity}}<a href="/my" class="identity-link"><span class="avatar avatar-small">我</span><span>{{.Identity.Alias}}<small>个人内容与账户设置</small></span></a>{{else}}<p>登录后参与讨论<br>收藏感兴趣的内容。</p><a class="btn" href="/login">登录星图</a>{{end}}<p class="local-label"><span class="status-dot"></span> 本地测试环境</p></div></aside>
<div class="workspace"><header class="topbar"><span>星图 <span class="topbar-sep">/</span> {{.Title}}</span><div><a href="/discover">探索社群</a>{{if .Identity}}<a href="/my/drafts">草稿</a>{{else}}<a href="/login">登录</a>{{end}}</div></header><main class="main page-{{.Page}}" id="main">{{.Content}}</main><footer class="site-footer">星图 · 让讨论有来处 <a href="/help">使用与权利说明</a><a href="/status">运行状态</a><span>本地测试，尚未开放真实用户</span></footer></div>
</div></body></html>
