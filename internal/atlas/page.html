<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{.Title}} · AtlasSite</title><link rel="stylesheet" href="/assets/site.css"><script src="/assets/core.js" defer></script></head>
<body><a class="skip-link" href="#main">跳到内容</a><div class="layout"><aside class="sidebar">
      <a href="/" class="logo" aria-label="AtlasSite 首页">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
            <path d="M36 8 C35.5 13 36 18 35.5 22 C35 25 33.5 27 30.5 28.5 C25 31 18 33 11 35"/>
            <path d="M12.5 39 C17 38.5 20.5 40 26 43"/>
            <path d="M29 42.5 C31 48 34 52 34.5 58"/>
            <circle cx="36" cy="8" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="11" cy="35" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="26" cy="43" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="29" cy="42.5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="34.5" cy="58" r="1.5" fill="currentColor" stroke="none"/>
          </g>
        </svg>
        <span>AtlasSite</span>
      </a>

      <nav class="nav" aria-label="主要导航">
        <a href="/" aria-label="首页" class="nav-item {{if eq .Page "home"}}active{{end}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </a>
        <a href="/discover" aria-label="发现" class="nav-item {{if or (eq .Page "discover") (eq .Page "community") (eq .Page "topic")}}active{{end}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          <span>发现</span>
        </a>
        <a href="/notifications" aria-label="通知" class="nav-item {{if eq .Page "notifications"}}active{{end}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>通知</span>
        </a>
        <a href="/settings" aria-label="设置" class="nav-item {{if eq .Page "settings"}}active{{end}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>设置</span>
        </a>
      <a href="/my" aria-label="我的" class="nav-item {{if or (eq .Page "my") (eq .Page "user") (eq .Page "bookmarks") (eq .Page "drafts") (eq .Page "subscriptions")}}active{{end}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>我的</span></a></nav>
    <div class="sidebar-footer">{{if .Identity}}<a href="/my">{{.Identity.Alias}}</a>{{else}}<a class="btn" href="/login">登录</a>{{end}}<a class="btn btn-secondary" href="/new">发布</a></div></aside>
<div class="workspace"><header class="mobile-header"><a class="logo" href="/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
            <path d="M36 8 C35.5 13 36 18 35.5 22 C35 25 33.5 27 30.5 28.5 C25 31 18 33 11 35"/>
            <path d="M12.5 39 C17 38.5 20.5 40 26 43"/>
            <path d="M29 42.5 C31 48 34 52 34.5 58"/>
            <circle cx="36" cy="8" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="11" cy="35" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="26" cy="43" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="29" cy="42.5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="34.5" cy="58" r="1.5" fill="currentColor" stroke="none"/>
          </g>
        </svg><span>AtlasSite</span></a><a href="/new">发布</a></header>
<main class="main page-{{.Page}}" id="main">
<nav class="page-tools" aria-label="页面工具">
  <a class="tool-icon" href="/search" data-overlay-open="search-overlay" aria-label="搜索" title="搜索" aria-haspopup="dialog" aria-controls="search-overlay" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></a>
  <button class="tool-icon" type="button" data-overlay-open="more-overlay" aria-label="更多" title="更多" aria-haspopup="dialog" aria-controls="more-overlay" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
</nav>
{{.Content}}{{if ne .Page "home"}}<footer class="site-footer"><a href="/help">帮助</a><a href="/status">状态</a><span>本地测试</span></footer>{{end}}</main></div></div>
<dialog class="page-overlay search-overlay" id="search-overlay" aria-labelledby="search-overlay-title">
  <header class="overlay-heading"><h2 id="search-overlay-title">搜索</h2><button class="tool-icon" type="button" data-overlay-close aria-label="关闭搜索" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
  <form action="/search" method="get" class="overlay-search-form">
    <label for="overlay-query" class="sr-only">搜索内容、社群或用户</label><div class="overlay-search-input"><input id="overlay-query" type="search" name="q" maxlength="100" placeholder="搜索内容、社群或用户…" required autofocus><button class="tool-icon" type="submit" aria-label="开始搜索" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button></div>
    <label for="overlay-search-type" class="sr-only">搜索范围</label><select id="overlay-search-type" name="type" aria-label="搜索范围"><option value="">全部</option><option value="post">动态</option><option value="community">社群</option><option value="topic">主题</option><option value="user">用户</option></select>
  </form>
</dialog>
<dialog class="page-overlay more-overlay" id="more-overlay" aria-labelledby="more-overlay-title">
  <header class="overlay-heading"><h2 id="more-overlay-title">更多</h2><button class="tool-icon" type="button" data-overlay-close aria-label="关闭更多" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
  {{.More}}
  <nav class="overlay-links overlay-section" aria-label="常用入口"><a href="/my">我的</a><a href="/settings">设置</a><a href="/help">帮助</a>{{if eq .Page "home"}}<a href="/status">状态</a>{{end}}</nav>
  {{if eq .Page "home"}}<p class="overlay-note">本地测试</p>{{end}}
</dialog>
</body></html>
