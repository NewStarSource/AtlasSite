<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - 星图 AtlasSite</title>
  <style>
    :root {
      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
      --text-sm: clamp(0.875rem, 0.825rem + 0.25vw, 0.9375rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.0625rem);
      --text-lg: clamp(1.125rem, 1.05rem + 0.375vw, 1.25rem);
      --text-xl: clamp(1.25rem, 1.15rem + 0.5vw, 1.5rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
      --content-width: 720px; --sidebar-width: 240px;
      --radius-sm: 4px; --radius-md: 8px; --radius-full: 999px;

      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5F5;
      --bg-tertiary: #EBEBEB;
      --bg-hover: #F9F9F9;
      --text-primary: #000000;
      --text-secondary: #525252;
      --text-tertiary: #737373;
      --text-inverse: #FFFFFF;
      --border-subtle: #E5E5E5;
      --border-default: #D4D4D4;
      --border-strong: #A3A3A3;
      --accent-primary: #0066FF;

      --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.04);
      --shadow-sm: 0 2px 4px 0 rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.03);
      --shadow-md: 0 4px 8px 0 rgba(0,0,0,0.08), 0 2px 4px 0 rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 16px 0 rgba(0,0,0,0.1), 0 4px 8px 0 rgba(0,0,0,0.06);

      --focus-ring: 0 0 0 3px rgba(0,102,255,0.2);

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 500ms cubic-bezier(0.33, 1, 0.68, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0A0A0A;
        --bg-secondary: #141414;
        --bg-tertiary: #1F1F1F;
        --bg-hover: #262626;
        --text-primary: #FAFAFA;
        --text-secondary: #A3A3A3;
        --text-tertiary: #737373;
        --text-inverse: #0A0A0A;
        --border-subtle: #262626;
        --border-default: #404040;
        --border-strong: #525252;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-base); font-size: var(--text-base); line-height: 1.75; color: var(--text-primary); background: var(--bg-primary); }
    h1, h2, h3 { font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; }
    h1 { font-size: var(--text-xl); }
    h2 { font-size: var(--text-lg); }
    a { color: var(--text-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

    .sidebar { position: sticky; top: 0; height: 100vh; padding: var(--space-6) var(--space-4); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: var(--space-8); background: var(--bg-primary); }
    @media (max-width: 768px) { .sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; padding: var(--space-3); border-right: none; border-top: 1px solid var(--border-subtle); z-index: 100; } }

    .logo { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.03em; color: var(--text-primary); }
    .logo svg { width: 32px; height: 32px; }
    @media (max-width: 768px) { .logo span { display: none; } }

    .nav { display: flex; flex-direction: column; gap: var(--space-1); }
    @media (max-width: 768px) { .nav { flex-direction: row; gap: 0; } }

    .nav-item { padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--text-secondary); font-size: var(--text-sm); transition: all var(--transition-fast); display: flex; align-items: center; gap: var(--space-2); }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); text-decoration: none; transform: translateX(2px); }
    .nav-item.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 500; }
    .nav-item:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    @media (max-width: 768px) { .nav-item { flex-direction: column; gap: var(--space-1); padding: var(--space-2); font-size: var(--text-xs); } }

    .main { max-width: var(--content-width); margin: 0 auto; padding: var(--space-6) var(--space-4) calc(var(--space-12) + 60px); }
    @media (min-width: 769px) { .main { padding-bottom: var(--space-12); } }

    .breadcrumb { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-6); font-size: var(--text-sm); color: var(--text-tertiary); }
    .breadcrumb a { color: var(--text-secondary); }
    .breadcrumb a:hover { color: var(--text-primary); text-decoration: underline; }
    .breadcrumb-sep { opacity: 0.5; }

    .page-header { margin-bottom: var(--space-8); }
    .page-title { margin-bottom: var(--space-3); }
    .page-subtitle { color: var(--text-secondary); margin-bottom: var(--space-4); line-height: 1.6; }

    .search-box { width: 100%; padding: var(--space-3); background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-base); color: var(--text-primary); transition: all var(--transition-base); }
    .search-box:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); background: var(--bg-primary); }
    .search-box::placeholder { color: var(--text-tertiary); }

    .category-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-8); }
    .category-section { padding-bottom: var(--space-6); border-bottom: 1px solid var(--border-subtle); }
    .category-section:last-child { border-bottom: none; }

    .category-header { margin-bottom: var(--space-4); }
    .category-title { font-size: var(--text-lg); margin-bottom: var(--space-2); }
    .category-desc { color: var(--text-secondary); font-size: var(--text-sm); }

    .direction-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .direction-item { padding: var(--space-4); background: var(--bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); transition: all var(--transition-base); }
    .direction-item:hover { background: var(--bg-tertiary); transform: translateY(-2px); text-decoration: none; box-shadow: var(--shadow-md); }
    .direction-name { font-weight: 600; margin-bottom: var(--space-2); }
    .direction-desc { color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--space-3); }

    .subcategory-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .subcategory-tag { padding: var(--space-1) var(--space-3); background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-full); font-size: var(--text-sm); color: var(--text-secondary); transition: all var(--transition-fast); }
    .subcategory-tag:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-strong); text-decoration: none; }

    .community-list { display: grid; grid-template-columns: 1fr; gap: var(--space-3); margin-top: var(--space-3); }
    .community-card { padding: var(--space-4); background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); transition: all var(--transition-base); }
    .community-card:hover { border-color: var(--border-default); transform: translateY(-2px); text-decoration: none; box-shadow: var(--shadow-lg); }
    .community-name { font-weight: 600; margin-bottom: var(--space-2); }
    .community-desc { color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--space-3); }
    .community-meta { display: flex; gap: var(--space-4); font-size: var(--text-xs); color: var(--text-tertiary); }

    .community-header { padding-bottom: var(--space-6); border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--space-8); }
    .community-title { font-size: var(--text-xl); margin-bottom: var(--space-3); }
    .community-subtitle { color: var(--text-secondary); margin-bottom: var(--space-4); line-height: 1.6; }
    .community-actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); }

    .btn { padding: var(--space-2) var(--space-4); background: var(--text-primary); color: var(--text-inverse); border: none; border-radius: var(--radius-full); font-family: inherit; font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: all var(--transition-fast); }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-default); }
    .btn-secondary:hover { background: var(--bg-tertiary); opacity: 1; }

    .tabs { display: flex; gap: var(--space-4); margin-bottom: var(--space-6); border-bottom: 1px solid var(--border-subtle); }
    .tab-btn { padding: var(--space-2) 0; background: none; border: none; color: var(--text-secondary); font-size: var(--text-base); font-family: inherit; cursor: pointer; border-bottom: 2px solid transparent; transition: all var(--transition-fast); }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active { color: var(--text-primary); font-weight: 500; border-bottom-color: var(--text-primary); }

    .content-section { margin-bottom: var(--space-8); }
    .section-title { margin-bottom: var(--space-4); }
    .collection-card { padding: var(--space-4); background: var(--bg-secondary); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
    .collection-title { font-weight: 600; margin-bottom: var(--space-2); }
    .collection-content { color: var(--text-secondary); line-height: 1.8; white-space: pre-wrap; }

    .topic-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .topic-tag { padding: var(--space-2) var(--space-3); background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-full); font-size: var(--text-sm); transition: all var(--transition-fast); }
    .topic-tag:hover { background: var(--bg-tertiary); border-color: var(--border-strong); text-decoration: none; }

    .status-badge { display: inline-block; padding: var(--space-1) var(--space-2); background: var(--bg-secondary); border-radius: var(--radius-sm); font-size: var(--text-xs); color: var(--text-tertiary); }
    .status-badge.verified { background: rgba(0,102,255,0.1); color: var(--accent-primary); }

    .empty-state { padding: var(--space-8); text-align: center; color: var(--text-tertiary); }

    .search-header { margin-bottom: var(--space-8); }
    .search-input-container { position: relative; max-width: 600px; margin: 0 auto; }
    .search-icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
    .search-input { width: 100%; padding: var(--space-3) var(--space-3) var(--space-3) calc(var(--space-3) * 2 + 20px); background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-full); color: var(--text-primary); font-family: inherit; font-size: var(--text-base); transition: all var(--transition-fast); }
    .search-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
    .search-input::placeholder { color: var(--text-tertiary); }

    .result-group { margin-bottom: var(--space-8); }
    .result-group-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border-subtle); }
    .result-group-title { font-size: var(--text-lg); font-weight: 600; }
    .result-group-count { font-size: var(--text-sm); color: var(--text-tertiary); }

    /* Post styles */
    .post-article { margin-bottom: var(--space-8); padding-bottom: var(--space-8); border-bottom: 1px solid var(--border-subtle); }
    .post-meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--text-tertiary); flex-wrap: wrap; }
    .post-author { color: var(--text-primary); font-weight: 500; }
    .post-community { color: var(--accent-primary); font-weight: 500; }
    .post-title { margin-bottom: var(--space-4); font-size: var(--text-xl); font-weight: 600; line-height: 1.3; }
    .post-content { margin-bottom: var(--space-6); line-height: 1.75; white-space: pre-wrap; }
    .post-actions { display: flex; gap: var(--space-6); }
    .action-btn { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1); background: none; border: none; color: var(--text-tertiary); font-size: var(--text-sm); cursor: pointer; transition: all var(--transition-fast); }
    .action-btn:hover { color: var(--text-primary); transform: translateY(-1px); }
    .bookmark-btn.bookmarked { color: var(--accent-primary); }
    .bookmark-btn.bookmarked .bookmark-icon { color: var(--accent-primary); }
    .bookmark-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Feed styles */
    .feed-list { display: flex; flex-direction: column; gap: var(--space-6); }
    .feed-item { padding-bottom: var(--space-6); border-bottom: 1px solid var(--border-subtle); }
    .feed-item:last-child { border-bottom: none; }
    .feed-meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); font-size: var(--text-sm); color: var(--text-tertiary); flex-wrap: wrap; }
    .feed-author { color: var(--text-primary); font-weight: 500; }
    .feed-community { color: var(--accent-primary); font-weight: 500; }
    .feed-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
    .feed-title a { color: var(--text-primary); }
    .feed-title a:hover { color: var(--accent-primary); }
    .feed-excerpt { color: var(--text-secondary); margin-bottom: var(--space-3); line-height: 1.6; }
    .feed-stats { display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--text-tertiary); }

    /* Reply composer */
    .reply-composer { margin-bottom: var(--space-8); padding: var(--space-6); background: var(--bg-secondary); border-radius: var(--radius-md); transition: all var(--transition-base); }
    .reply-composer:focus-within { background: var(--bg-primary); box-shadow: var(--shadow-md); }
    .reply-composer h2 { margin-bottom: var(--space-4); font-size: var(--text-lg); }
    .reply-textarea { width: 100%; min-height: 120px; padding: var(--space-3); background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-family: inherit; font-size: var(--text-base); color: var(--text-primary); resize: vertical; transition: all var(--transition-fast); }
    .reply-textarea:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
    .reply-textarea:hover { border-color: var(--border-strong); }
    .reply-actions { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-3); }

    /* Reply tree */
    .replies-section { margin-top: var(--space-8); }
    .replies-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border-subtle); }
    .replies-count { font-size: var(--text-lg); font-weight: 600; }
    .reply-tree { display: flex; flex-direction: column; gap: var(--space-4); }
    .reply-item { position: relative; transition: all var(--transition-base); }
    .reply-item.level-0 { margin-left: 0; }
    .reply-item.level-1 { margin-left: var(--space-8); padding-left: var(--space-4); border-left: 2px solid var(--border-subtle); }
    .reply-item.level-2 { margin-left: calc(var(--space-8) * 2); padding-left: var(--space-4); border-left: 2px solid var(--border-subtle); }
    .reply-item.level-3-plus { margin-left: calc(var(--space-8) * 3); padding-left: var(--space-4); border-left: 2px solid var(--border-subtle); }
    .reply-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); font-size: var(--text-sm); }
    .reply-author { font-weight: 500; color: var(--text-primary); }
    .reply-time { color: var(--text-tertiary); }
    .reply-body { margin-bottom: var(--space-3); line-height: 1.6; color: var(--text-secondary); }
    .reply-children { margin-top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    /* Post composer */
    .post-composer { max-width: 600px; }
    .composer-title { margin-bottom: var(--space-6); }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { display: block; margin-bottom: var(--space-2); font-weight: 500; }
    .form-input { width: 100%; padding: var(--space-3); background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-family: inherit; font-size: var(--text-base); color: var(--text-primary); transition: all var(--transition-fast); }
    .form-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
    .form-textarea { width: 100%; min-height: 300px; padding: var(--space-3); background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-family: inherit; font-size: var(--text-base); color: var(--text-primary); resize: vertical; transition: all var(--transition-fast); }
    .form-textarea:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
    .form-actions { display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6); }
    .composer-quick { margin-bottom: var(--space-6); text-align: center; }

    /* Discovery page */
    .discover-container { max-width: 900px; }
    .page-title { font-size: var(--text-xl); font-weight: 600; margin-bottom: var(--space-2); }
    .page-subtitle { color: var(--text-secondary); margin-bottom: var(--space-8); }
    .domain-section { margin-bottom: var(--space-12); }
    .domain-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
    .domain-description { color: var(--text-secondary); margin-bottom: var(--space-6); }
    .direction-section { margin-bottom: var(--space-8); }
    .direction-title { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-4); color: var(--text-secondary); }
    .subcategory-section { margin-bottom: var(--space-6); }
    .subcategory-title { font-size: var(--text-sm); font-weight: 500; margin-bottom: var(--space-3); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
    .community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .community-card { display: block; padding: var(--space-4); background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); transition: all var(--transition-fast); }
    .community-card:hover { background: var(--bg-hover); border-color: var(--accent-primary); box-shadow: var(--shadow-sm); transform: translateY(-1px); }

    /* User activity page */
    .user-profile-header { margin-bottom: var(--space-8); padding: var(--space-6); background: var(--bg-secondary); border-radius: var(--radius-md); }
    .user-profile-top { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); }
    .user-avatar { width: 64px; height: 64px; border-radius: 999px; background: var(--accent-primary); display: flex; align-items: center; justify-content: center; font-size: var(--text-xl); font-weight: 600; color: white; }
    .user-profile-info { flex: 1; }
    .user-name { font-size: var(--text-xl); font-weight: 600; margin-bottom: var(--space-1); }
    .user-meta { color: var(--text-tertiary); font-size: var(--text-sm); }
    .user-stats { display: flex; gap: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); }
    .user-stat { display: flex; flex-direction: column; }
    .user-stat-value { font-size: var(--text-lg); font-weight: 600; }
    .user-stat-label { color: var(--text-tertiary); font-size: var(--text-sm); }
    .profile-link-btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--accent-primary); color: white; border-radius: 999px; font-size: var(--text-sm); font-weight: 500; transition: all var(--transition-fast); }
    .profile-link-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

    .activity-section { margin-bottom: var(--space-8); }
    .activity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border-subtle); }
    .activity-title { font-size: var(--text-lg); font-weight: 600; }
    .activity-list { display: flex; flex-direction: column; gap: var(--space-4); }

    /* Bookmark page */
    .bookmarks-container { max-width: 800px; }
    .empty-state { text-align: center; padding: var(--space-12) var(--space-6); }
    .empty-icon { font-size: 48px; margin-bottom: var(--space-4); opacity: 0.5; }
    .empty-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
    .empty-description { color: var(--text-secondary); margin-bottom: var(--space-6); }
    .community-card-title { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }
    .badge-verified { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: var(--accent-primary); color: var(--text-inverse); border-radius: 50%; font-size: 10px; }
    .community-card-description { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-section { animation: fadeIn var(--transition-smooth) ease-out; }
    .category-section:nth-child(1) { animation-delay: 50ms; }
    .category-section:nth-child(2) { animation-delay: 100ms; }
    .category-section:nth-child(3) { animation-delay: 150ms; }
  </style>
  <script>
    function toggleBookmark(btn) {
      if (btn.disabled) return;
      btn.disabled = true;
      const postId = btn.dataset.postId;
      fetch('/api/v1/p/' + postId + '/bookmark', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => res.json())
      .then(data => {
        if (data.bookmarked) {
          btn.classList.add('bookmarked');
          btn.querySelector('.bookmark-icon').textContent = '★';
          btn.querySelector('.bookmark-text').textContent = '已收藏';
        } else {
          btn.classList.remove('bookmarked');
          btn.querySelector('.bookmark-icon').textContent = '☆';
          btn.querySelector('.bookmark-text').textContent = '收藏';
        }
      })
      .catch(err => console.error('收藏失败:', err))
      .finally(() => btn.disabled = false);
    }
  </script>
</head>
