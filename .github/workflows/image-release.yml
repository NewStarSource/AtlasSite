name: image-release

# Builds the linux/amd64 runtime image for a published GitHub Release and
# attaches it to that release as a compressed image archive. The production
# host pulls the archive, imports it into containerd and promotes it; it never
# accepts inbound connections from CI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true

permissions:
  contents: write

concurrency:
  group: image-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/staratlas ./cmd/staratlas
          file dist/staratlas
          sha256sum dist/staratlas

      - name: Build container image
        run: |
          set -euo pipefail
          docker build \
            --build-arg COMMIT="${GITHUB_SHA}" \
            -t "staratlas/atlas:${TAG}" \
            -f Dockerfile .
          docker image inspect "staratlas/atlas:${TAG}" --format '{{.Id}} {{.Architecture}}'

      - name: Export image archive
        run: |
          set -euo pipefail
          docker save "staratlas/atlas:${TAG}" | gzip -9 > "atlas-image-${TAG}.tar.gz"
          sha256sum "atlas-image-${TAG}.tar.gz" > "atlas-image-${TAG}.sha256"
          ls -lh "atlas-image-${TAG}.tar.gz"

      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "atlas-image-${TAG}.tar.gz" \
            "atlas-image-${TAG}.sha256" \
            --clobber

      - name: Summary
        run: |
          {
            echo "### 星图镜像已发布"
            echo ""
            echo "- 版本：\`${TAG}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 镜像：\`staratlas/atlas:${TAG}\`"
            echo "- 附件：\`atlas-image-${TAG}.tar.gz\`"
            echo "- 服务器由 \`staratlas-release-watch.timer\` 自动拉取并滚动更新"
          } >> "$GITHUB_STEP_SUMMARY"
